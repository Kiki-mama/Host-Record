<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的排档主持记录</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy-deep: #0f294a;
      --navy-mid: #1e3a5f;
      --navy-hover: #163052;
      --blue-bright: #2563eb;
      --blue-soft: #e8f0fe;
      --bg-ice: #f4f7fb;
      --card-white: #ffffff;
      --border-slate: #dce4ef;
      --text-primary: #0f294a;
      --text-secondary: #5a6b82;
    }

    * {
      box-sizing: border-box;
      font-family: "Inter", "Noto Sans SC", system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-ice);
      color: var(--text-primary);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }

    .navy-card {
      background: var(--card-white);
      border: 1px solid var(--border-slate);
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(15, 41, 74, 0.04);
    }

    .btn-navy {
      border: 1px solid #c7d4e6;
      background: #ffffff;
      color: var(--navy-deep);
      border-radius: 10px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.16s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-navy:hover {
      background: #eef4fc;
      border-color: #9cb3d3;
    }

    .btn-navy:active {
      transform: scale(0.98);
    }

    .btn-navy:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-navy-primary {
      background: var(--navy-deep);
      border-color: var(--navy-deep);
      color: #ffffff;
    }

    .btn-navy-primary:hover {
      background: var(--navy-hover);
      border-color: var(--navy-hover);
    }

    .btn-navy-danger {
      color: #c62828;
      border-color: transparent;
      background: transparent;
    }

    .btn-navy-danger:hover {
      background: #fdecec;
      border-color: #f8caca;
    }

    .input-navy {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #cbd6e6;
      border-radius: 10px;
      font-size: 14px;
      background: #f9fbfe;
      color: var(--navy-deep);
      outline: none;
      transition: border-color 0.18s ease, background-color 0.18s ease;
    }

    .input-navy:focus {
      border-color: var(--blue-bright);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .slot-box {
      border: 1px solid #d5dfed;
      background: #f9fbfe;
      color: var(--navy-deep);
      border-radius: 10px;
      padding: 10px 6px;
      text-align: center;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }

    .slot-box:hover {
      border-color: #7da1d4;
      background: #eef5ff;
    }

    .slot-box.checked {
      background: var(--navy-deep);
      border-color: var(--navy-deep);
      color: #ffffff;
      box-shadow: 0 3px 8px rgba(15, 41, 74, 0.22);
    }

    .slot-box.checked .slot-sub {
      color: #b8d0f0;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translate(-50%, -14px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    .toast-banner {
      animation: toastIn 0.22s ease forwards;
    }

    .modal-overlay {
      background: rgba(15, 41, 74, 0.45);
      backdrop-filter: blur(2px);
    }
  </style>
</head>
<body class="pb-14">

  <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 pointer-events-none flex flex-col gap-2 w-11/12 max-w-sm"></div>
  <div id="app" class="max-w-3xl mx-auto px-4 pt-6 sm:pt-8"></div>
  <div id="modal-root" class="fixed inset-0 z-40 hidden items-center justify-center p-4 modal-overlay"></div>

  <script>
    const SUPABASE_URL = 'https://fnuzrsmptamcimqyimpl.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_JZKRwBABwg4XZPK0-nV7mA_tpByDyqO';
    const STORAGE_KEY = 'schedule_host_record';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let authMode = 'login';
    let syncStatus = 'idle';
    let syncTimer = null;

    function getDefaultPlatforms() {
      return [
        {
          id: 'miya',
          name: 'Miya',
          badge: 'bg-blue-50 text-[#0f294a] border-blue-200',
          myrPerCoin: 0.7 / 180,
          ruleText: '魅力值 = 金币 × 0.7 | 马币 = 魅力值 ÷ 180',
          builtin: true
        },
        {
          id: 'momi',
          name: 'Momi',
          badge: 'bg-indigo-50 text-[#1e3a5f] border-indigo-200',
          myrPerCoin: (0.7 / 10000) * 52,
          ruleText: '魅力值 = 金币 × 0.7 | 马币 = 魅力值 ÷ 10000 × 52',
          builtin: true
        },
        {
          id: 'migo',
          name: 'Migo',
          badge: 'bg-sky-50 text-[#0f294a] border-sky-200',
          mode: 'migo_usd',
          myrPerCoin: null,
          ruleText: '礼物值 = 金币 × 2.8 | 美元 = 礼物值 ÷ 40000 | 马币 = 美元 × 汇率',
          builtin: true
        }
      ];
    }

    function normalizeData(rawObj) {
      const fallback = {
        venues: [],
        global: { usdToMyr: 4.6 },
        platforms: getDefaultPlatforms()
      };
      if (!rawObj || typeof rawObj !== 'object') return fallback;

      const parsed = JSON.parse(JSON.stringify(rawObj));
      if (!Array.isArray(parsed.venues)) parsed.venues = [];
      if (!parsed.global || typeof parsed.global.usdToMyr !== 'number' || isNaN(parsed.global.usdToMyr)) {
        parsed.global = { usdToMyr: 4.6 };
      }

      if (!Array.isArray(parsed.platforms) || parsed.platforms.length === 0) {
        parsed.platforms = getDefaultPlatforms();
      } else {
        const defaults = getDefaultPlatforms();
        defaults.forEach(def => {
          const exists = parsed.platforms.find(x => x.id === def.id);
          if (!exists) {
            parsed.platforms.unshift(def);
          } else {
            if (!exists.name) exists.name = def.name;
            if (!exists.badge) exists.badge = def.badge;
            if (def.mode === 'migo_usd') {
              exists.mode = 'migo_usd';
            } else if (typeof exists.myrPerCoin !== 'number' || isNaN(exists.myrPerCoin)) {
              exists.myrPerCoin = def.myrPerCoin;
            }
          }
        });
        parsed.platforms.forEach(p => {
          if (!p.id) p.id = uuid();
          if (!p.name) p.name = '未命名软件';
          if (!p.badge) p.badge = 'bg-slate-100 text-[#0f294a] border-slate-300';
          if (p.mode !== 'migo_usd' && (typeof p.myrPerCoin !== 'number' || isNaN(p.myrPerCoin))) {
            p.myrPerCoin = 0;
          }
        });
      }

      const validIds = new Set(parsed.platforms.map(p => p.id));
      parsed.venues.forEach(v => {
        if (!v.id) v.id = uuid();
        if (!v.name) v.name = '未命名场地';
        if (!v.openStart) v.openStart = '20:00';
        if (!v.openEnd) v.openEnd = '02:00';
        if (typeof v.scheduleCoinPer !== 'number' || isNaN(v.scheduleCoinPer)) v.scheduleCoinPer = 0;
        if (typeof v.hostCoinPerHour !== 'number' || isNaN(v.hostCoinPerHour)) v.hostCoinPerHour = 0;
        if (!Array.isArray(v.scheduleList)) v.scheduleList = [];
        if (!Array.isArray(v.hostList)) v.hostList = [];
        if (!validIds.has(v.platform)) {
          v.platform = parsed.platforms[0]?.id || 'miya';
        }
      });

      return parsed;
    }

    function loadLocalData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return normalizeData(null);
        return normalizeData(JSON.parse(raw));
      } catch (err) {
        return normalizeData(null);
      }
    }

    let data = loadLocalData();

    function getPlatformById(platformId) {
      const found = data.platforms.find(p => p.id === platformId);
      if (found) return found;
      return data.platforms[0] || getDefaultPlatforms()[0];
    }

    function getPlatformRuleText(p, globalCfg) {
      if (!p) return '';
      if (p.mode === 'migo_usd') {
        const rate = Number(globalCfg?.usdToMyr) || 4.6;
        return `礼物值 = 金币 × 2.8 | 美元 = 礼物值 ÷ 40000 | 马币 = 美元 × ${rate}`;
      }
      const rate = Number(p.myrPerCoin) || 0;
      if (p.ruleText && !p.customRateEdited) return p.ruleText;
      return `换算率：1 金币 = ${rate.toFixed(6)} MYR`;
    }

    function calcCoinsToMyr(coins, platformId, globalCfg) {
      const p = getPlatformById(platformId);
      const safeCoins = Number(coins) || 0;
      if (p && p.mode === 'migo_usd') {
        const gift = safeCoins * 2.8;
        const usd = gift / 40000;
        const rate = Number(globalCfg?.usdToMyr) || 4.6;
        return usd * rate;
      }
      const rate = Number(p?.myrPerCoin) || 0;
      return safeCoins * rate;
    }

    let currentVenueId = null;
    let currentTab = 'schedule';
    let selectedScheduleDate = getTodayDateStr();
    let selectedHostDate = getTodayDateStr();
    let hostHoursOnlyOperating = false;
    let showCustomHostForm = false;

    function save(skipCloud = false) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (err) {
        showToast('保存到本地缓存失败', 'error');
      }

      if (!skipCloud && currentUser) {
        syncStatus = 'syncing';
        updateSyncBadge();
        clearTimeout(syncTimer);
        syncTimer = setTimeout(() => {
          pushDataToCloud();
        }, 500);
      }
    }

    function updateSyncBadge() {
      const el = document.getElementById('sync-status-badge');
      if (!el) return;
      if (syncStatus === 'syncing') {
        el.innerHTML = '<span class="text-[#2563eb]">● 正在同步云端...</span>';
      } else if (syncStatus === 'synced') {
        el.innerHTML = '<span class="text-emerald-600">● 云端已同步</span>';
      } else if (syncStatus === 'error') {
        el.innerHTML = '<span class="text-red-600">● 同步异常（已存本地）</span>';
      } else {
        el.innerHTML = '<span class="text-[#5a6b82]">● 云端在线</span>';
      }
    }

    async function pushDataToCloud() {
      if (!currentUser) return;
      try {
        const { error } = await supabaseClient
          .from('user_records')
          .upsert({
            user_id: currentUser.id,
            data: data,
            updated_at: new Date().toISOString()
          });
        if (error) throw error;
        syncStatus = 'synced';
        updateSyncBadge();
      } catch (err) {
        syncStatus = 'error';
        updateSyncBadge();
      }
    }

    async function pullDataFromCloud(showNotice = false) {
      if (!currentUser) return;
      syncStatus = 'syncing';
      updateSyncBadge();
      try {
        const { data: row, error } = await supabaseClient
          .from('user_records')
          .select('data')
          .eq('user_id', currentUser.id)
          .maybeSingle();
        if (error) throw error;

        if (row && row.data) {
          data = normalizeData(row.data);
          save(true);
          syncStatus = 'synced';
          if (showNotice) showToast('已从云端同步最新记录', 'success');
        } else {
          await pushDataToCloud();
          if (showNotice) showToast('已初始化并上传数据至云端', 'success');
        }
      } catch (err) {
        syncStatus = 'error';
        showToast('云端同步失败，请检查网络或表配置', 'error');
      }
      renderCurrentView();
    }

    function renderCurrentView() {
      if (!currentUser) {
        renderAuthScreen();
        return;
      }
      if (currentVenueId) {
        renderVenue();
      } else {
        renderHome();
      }
    }

    function renderAuthScreen() {
      const isLogin = authMode === 'login';
      document.getElementById('app').innerHTML = `
        <div class="max-w-md mx-auto mt-8 sm:mt-12">
          <div class="text-center mb-6">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white border border-[#dce4ef] text-xs font-medium text-[#1e3a5f] mb-2">
              <span>云端多设备同步版</span>
            </div>
            <h1 class="text-2xl font-bold tracking-wide text-[#0f294a]">我的排档主持记录</h1>
            <p class="text-xs text-[#5a6b82] mt-1">登录同一 Email 账号，手机、平板与电脑实时同步</p>
          </div>
          <div class="navy-card p-6">
            <div class="grid grid-cols-2 bg-[#e2eaf5] p-1 rounded-xl mb-5">
              <button type="button" onclick="switchAuthMode('login')" class="py-2 text-xs sm:text-sm font-semibold rounded-lg transition ${isLogin ? 'bg-[#0f294a] text-white shadow-sm' : 'text-[#1e3a5f] hover:bg-white/60'}">Email 登录</button>
              <button type="button" onclick="switchAuthMode('signup')" class="py-2 text-xs sm:text-sm font-semibold rounded-lg transition ${!isLogin ? 'bg-[#0f294a] text-white shadow-sm' : 'text-[#1e3a5f] hover:bg-white/60'}">注册新账号</button>
            </div>
            <form onsubmit="handleAuthSubmit(event)" class="space-y-4">
              <div>
                <label class="block text-xs font-semibold text-[#1e3a5f] mb-1">Email 邮箱</label>
                <input type="email" id="authEmail" required class="input-navy" placeholder="name@example.com">
              </div>
              <div>
                <label class="block text-xs font-semibold text-[#1e3a5f] mb-1">密码（至少 6 位）</label>
                <input type="password" id="authPassword" required minlength="6" class="input-navy" placeholder="输入密码">
              </div>
              <button type="submit" id="authSubmitBtn" class="btn-navy btn-navy-primary w-full py-2.5 text-sm font-semibold">
                ${isLogin ? '登录并同步数据' : '创建账号并进入'}
              </button>
            </form>
            <p class="text-[11px] text-[#5a6b82] text-center mt-4 leading-relaxed">
              提示：若当前浏览器已有本地旧记录，首次登录后会自动上传合并到你的账号中。
            </p>
          </div>
        </div>
      `;
    }

    function switchAuthMode(mode) {
      authMode = mode;
      renderAuthScreen();
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;
      const btn = document.getElementById('authSubmitBtn');
      if (!email || !password) return;

      btn.disabled = true;
      btn.textContent = authMode === 'login' ? '正在登录...' : '正在创建账号...';

      try {
        if (authMode === 'login') {
          const { data: authData, error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) throw error;
          currentUser = authData.user;
          showToast('登录成功，正在同步云端数据...', 'success');
          await pullDataFromCloud(false);
        } else {
          const { data: authData, error } = await supabaseClient.auth.signUp({ email, password });
          if (error) throw error;
          if (authData.session) {
            currentUser = authData.user;
            showToast('注册成功，已自动登录！', 'success');
            await pullDataFromCloud(false);
          } else {
            showToast('注册成功！请前往邮箱点击验证链接后再登录', 'info');
            authMode = 'login';
            renderAuthScreen();
          }
        }
      } catch (err) {
        let msg = err.message || '操作失败';
        if (msg.includes('Invalid login credentials')) msg = '邮箱或密码错误';
        else if (msg.includes('User already registered')) msg = '该邮箱已注册，请直接切换至登录';
        else if (msg.includes('Email not confirmed')) msg = '邮箱尚未确认，请先在 Supabase 关闭 Confirm email 或查收验证邮件';
        showToast(msg, 'error');
        btn.disabled = false;
        btn.textContent = authMode === 'login' ? '登录并同步数据' : '创建账号并进入';
      }
    }

    async function handleLogout() {
      await supabaseClient.auth.signOut();
      currentUser = null;
      currentVenueId = null;
      syncStatus = 'idle';
      renderAuthScreen();
      showToast('已退出登录', 'info');
    }

    function uuid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function formatDateStr(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function getTodayDateStr() {
      return formatDateStr(new Date());
    }

    function getWeekStartDateStr() {
      const now = new Date();
      const dayOfWeek = now.getDay();
      const diffToMonday = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
      const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - diffToMonday);
      return formatDateStr(monday);
    }

    function getOperatingHours(openStart, openEnd) {
      if (!openStart || !openEnd || !openStart.includes(':') || !openEnd.includes(':')) {
        return [20, 21, 22, 23, 0, 1];
      }
      const [sh, sm] = openStart.split(':').map(Number);
      const [eh, em] = openEnd.split(':').map(Number);
      if ([sh, sm, eh, em].some(n => isNaN(n))) {
        return [20, 21, 22, 23, 0, 1];
      }
      if (sh === eh && sm === em) {
        return Array.from({ length: 24 }, (_, i) => (sh + i) % 24);
      }
      const startMin = sh * 60 + sm;
      let endMin = eh * 60 + em;
      if (endMin <= startMin) {
        endMin += 24 * 60;
      }
      const slotCount = Math.min(24, Math.max(1, Math.ceil((endMin - startMin) / 60)));
      const list = [];
      for (let i = 0; i < slotCount; i++) {
        list.push((sh + i) % 24);
      }
      return list;
    }

    function getHostRecordHours(h) {
      if (typeof h.hours === 'number' && !isNaN(h.hours) && h.hours >= 0) {
        return h.hours;
      }
      const diff = (new Date(h.endTime).getTime() - new Date(h.startTime).getTime()) / 3600000;
      return isNaN(diff) || diff < 0 ? 0 : diff;
    }

    function calcVenueStat(venue) {
      const today = getTodayDateStr();
      const weekStart = getWeekStartDateStr();
      const schPrice = Number(venue.scheduleCoinPer) || 0;
      const hostPrice = Number(venue.hostCoinPerHour) || 0;

      let schCoin = 0, schToday = 0, schWeek = 0;
      let weekSchCount = 0;
      venue.scheduleList.forEach(s => {
        if (!s || !s.checked) return;
        schCoin += schPrice;
        if (s.date === today) schToday += schPrice;
        if (s.date >= weekStart) {
          schWeek += schPrice;
          weekSchCount += 1;
        }
      });

      let hostCoin = 0, hostToday = 0, hostWeek = 0, totalHostHours = 0;
      let weekHostHours = 0;
      venue.hostList.forEach(h => {
        if (!h) return;
        const hrs = getHostRecordHours(h);
        const c = hrs * hostPrice;
        totalHostHours += hrs;
        hostCoin += c;
        if (h.date === today) hostToday += c;
        if (h.date >= weekStart) {
          hostWeek += c;
          weekHostHours += hrs;
        }
      });

      const totalCoin = schCoin + hostCoin;
      const totalToday = schToday + hostToday;
      const totalWeek = schWeek + hostWeek;

      return {
        schCoin,
        hostCoin,
        totalCoin,
        schToday,
        hostToday,
        totalToday,
        schWeek,
        hostWeek,
        totalWeek,
        weekSchCount,
        weekHostHours,
        totalHostHours,
        myr: calcCoinsToMyr(totalCoin, venue.platform, data.global),
        myrToday: calcCoinsToMyr(totalToday, venue.platform, data.global),
        myrWeek: calcCoinsToMyr(totalWeek, venue.platform, data.global)
      };
    }

    function calcByPlatformStat() {
      const map = {};
      data.platforms.forEach(p => {
        map[p.id] = {
          platform: p,
          todayCoin: 0,
          weekCoin: 0,
          allCoin: 0,
          weekSchCount: 0,
          weekHostHours: 0,
          todayMyr: 0,
          weekMyr: 0,
          allMyr: 0,
          venueCount: 0
        };
      });

      data.venues.forEach(v => {
        const pid = getPlatformById(v.platform).id;
        if (!map[pid]) {
          map[pid] = {
            platform: getPlatformById(pid),
            todayCoin: 0,
            weekCoin: 0,
            allCoin: 0,
            weekSchCount: 0,
            weekHostHours: 0,
            todayMyr: 0,
            weekMyr: 0,
            allMyr: 0,
            venueCount: 0
          };
        }
        const st = calcVenueStat(v);
        map[pid].venueCount += 1;
        map[pid].todayCoin += st.totalToday;
        map[pid].weekCoin += st.totalWeek;
        map[pid].allCoin += st.totalCoin;
        map[pid].weekSchCount += st.weekSchCount;
        map[pid].weekHostHours += st.weekHostHours;
      });

      let weekTotalMyr = 0;
      let weekTotalSch = 0;
      let weekTotalHostHours = 0;
      const list = Object.values(map).map(item => {
        item.todayMyr = calcCoinsToMyr(item.todayCoin, item.platform.id, data.global);
        item.weekMyr = calcCoinsToMyr(item.weekCoin, item.platform.id, data.global);
        item.allMyr = calcCoinsToMyr(item.allCoin, item.platform.id, data.global);
        weekTotalMyr += item.weekMyr;
        weekTotalSch += item.weekSchCount;
        weekTotalHostHours += item.weekHostHours;
        return item;
      });

      return { list, weekTotalMyr, weekTotalSch, weekTotalHostHours };
    }

    function showToast(msg, type = 'info') {
      const container = document.getElementById('toast-container');
      const el = document.createElement('div');
      const styles = {
        success: 'bg-[#0f294a] text-white border-[#1e3a5f]',
        error: 'bg-[#b91c1c] text-white border-[#991b1b]',
        info: 'bg-[#1e3a5f] text-white border-[#0f294a]'
      };
      el.className = `toast-banner px-4 py-2.5 rounded-xl shadow-lg border text-xs sm:text-sm font-medium text-center ${styles[type] || styles.info}`;
      el.textContent = msg;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.2s ease';
        setTimeout(() => el.remove(), 220);
      }, 2300);
    }

    function openModal(innerHtml) {
      const root = document.getElementById('modal-root');
      root.innerHTML = `<div class="navy-card w-full max-w-md p-5 sm:p-6 shadow-2xl">${innerHtml}</div>`;
      root.classList.remove('hidden');
      root.classList.add('flex');
    }

    function closeModal() {
      const root = document.getElementById('modal-root');
      root.classList.add('hidden');
      root.classList.remove('flex');
      root.innerHTML = '';
    }

    document.getElementById('modal-root').addEventListener('click', (e) => {
      if (e.target.id === 'modal-root') closeModal();
    });

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function renderHome() {
      if (!currentUser) return renderAuthScreen();
      currentVenueId = null;
      const { list: platformStats, weekTotalMyr, weekTotalSch, weekTotalHostHours } = calcByPlatformStat();
      const todayStr = getTodayDateStr();
      const weekStartStr = getWeekStartDateStr();

      let html = `
        <div class="navy-card px-3.5 py-2.5 mb-4 flex flex-wrap items-center justify-between gap-2 text-xs">
          <div class="flex items-center gap-2 min-w-0">
            <span class="font-semibold text-[#0f294a] truncate">${escapeHtml(currentUser.email)}</span>
            <span id="sync-status-badge" class="whitespace-nowrap"></span>
          </div>
          <div class="flex items-center gap-1.5 shrink-0">
            <button class="btn-navy px-2.5 py-1 text-xs" onclick="pullDataFromCloud(true)">立即同步</button>
            <button class="btn-navy btn-navy-danger px-2 py-1 text-xs" onclick="handleLogout()">退出</button>
          </div>
        </div>

        <header class="text-center mb-6">
          <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white border border-[#dce4ef] text-xs font-medium text-[#1e3a5f] mb-2">
            <span>自然日历计账 · 00:00 独立分日</span>
          </div>
          <h1 class="text-2xl font-bold tracking-wide text-[#0f294a]">我的排档主持记录</h1>
          <p class="text-xs text-[#5a6b82] mt-1">今日日历：${todayStr} · 本周起算：${weekStartStr} (周一)</p>
        </header>

        <section class="navy-card p-4 sm:p-5 mb-4">
          <div class="flex items-center justify-between mb-2.5">
            <h2 class="text-xs font-bold uppercase tracking-wider text-[#1e3a5f]">各软件本周排档 / 主持与收益（分开算）</h2>
            <span class="text-xs text-[#5a6b82]">Migo 汇率：1 USD = ${data.global.usdToMyr} MYR</span>
          </div>
          <div class="divide-y divide-[#e6edf6]">
      `;

      platformStats.forEach(item => {
        const p = item.platform;
        html += `
          <div class="py-2.5 flex flex-col gap-1">
            <div class="flex items-center justify-between gap-2 flex-wrap">
              <div class="flex items-center gap-2">
                <span class="text-xs px-2 py-0.5 rounded-md border font-semibold ${p.badge}">${escapeHtml(p.name)}</span>
                <span class="text-xs text-[#5a6b82]">${item.venueCount} 个场地</span>
              </div>
              <div class="text-xs font-semibold text-[#0f294a]">
                本周排档：<span class="text-[#2563eb]">${item.weekSchCount} 档</span> · 本周主持：<span class="text-[#2563eb]">${item.weekHostHours.toFixed(1)}h</span>
              </div>
            </div>
            <div class="text-xs sm:text-sm text-[#0f294a] flex flex-wrap items-center gap-x-3 gap-y-1">
              <span>今日：<strong>RM ${item.todayMyr.toFixed(2)}</strong> <span class="text-[11px] text-[#5a6b82]">(${item.todayCoin.toFixed(1)}币)</span></span>
              <span>本周：<strong class="text-[#2563eb]">RM ${item.weekMyr.toFixed(2)}</strong> <span class="text-[11px] text-[#5a6b82]">(${item.weekCoin.toFixed(1)}币)</span></span>
              <span>累计：<strong>RM ${item.allMyr.toFixed(2)}</strong></span>
            </div>
          </div>
        `;
      });

      html += `
          </div>
          <div class="pt-3 mt-1 border-t border-[#e6edf6] flex flex-wrap items-center justify-between gap-2 text-xs text-[#5a6b82]">
            <span>本周合计排档 ${weekTotalSch} 档 · 主持 ${weekTotalHostHours.toFixed(1)}h</span>
            <span>本周总共：<strong class="text-[#0f294a]">RM ${weekTotalMyr.toFixed(2)}</strong></span>
          </div>
        </section>

        <section class="navy-card p-4 sm:p-5 mb-4">
          <div class="flex items-center justify-between mb-4">
            <div>
              <h2 class="text-base font-bold text-[#0f294a]">场地列表 (${data.venues.length})</h2>
              <p class="text-xs text-[#5a6b82]">选择场地进行排档与主持小时格打卡</p>
            </div>
            <button class="btn-navy btn-navy-primary px-3.5 py-2 text-xs sm:text-sm" onclick="openVenueModal()">+ 新增场地</button>
          </div>
      `;

      if (data.venues.length === 0) {
        html += `
          <div class="text-center py-10 px-4 rounded-xl border border-dashed border-[#c7d4e6] bg-[#f9fbfe]">
            <p class="text-sm text-[#5a6b82] mb-3">还没有添加任何场地</p>
            <button class="btn-navy btn-navy-primary px-4 py-2 text-xs sm:text-sm" onclick="openVenueModal()">立即新增场地</button>
          </div>
        `;
      } else {
        html += `<div class="space-y-2.5">`;
        data.venues.forEach(v => {
          const p = getPlatformById(v.platform);
          const st = calcVenueStat(v);
          html += `
            <div class="rounded-xl p-3.5 bg-[#f9fbfe] hover:bg-white border border-[#dce4ef] transition flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div class="cursor-pointer flex-1" onclick="openVenue('${v.id}')">
                <div class="flex items-center gap-2 flex-wrap">
                  <span class="font-bold text-base text-[#0f294a]">${escapeHtml(v.name)}</span>
                  <span class="text-xs px-2 py-0.5 rounded-md border font-semibold ${p.badge}">${escapeHtml(p.name)}</span>
                </div>
                <div class="text-xs text-[#5a6b82] mt-1 flex flex-wrap gap-x-3 gap-y-1">
                  <span>营业 ${v.openStart} ~ ${v.openEnd}</span>
                  <span>排档 ${v.scheduleCoinPer}币/档</span>
                  <span>主持 ${v.hostCoinPerHour}币/h</span>
                </div>
                <div class="text-xs font-semibold text-[#1e3a5f] mt-1.5">
                  本周：${st.weekSchCount}档 / ${st.weekHostHours.toFixed(1)}h (RM ${st.myrWeek.toFixed(2)}) · 累计：RM ${st.myr.toFixed(2)}
                </div>
              </div>
              <div class="flex items-center gap-1.5 self-end sm:self-center">
                <button class="btn-navy btn-navy-primary px-3 py-1.5 text-xs" onclick="openVenue('${v.id}')">进入</button>
                <button class="btn-navy px-2.5 py-1.5 text-xs" onclick="openVenueModal('${v.id}')">编辑</button>
                <button class="btn-navy btn-navy-danger px-2.5 py-1.5 text-xs" onclick="confirmDelVenue('${v.id}')">删除</button>
              </div>
            </div>
          `;
        });
        html += `</div>`;
      }

      html += `</section>

        <section class="navy-card p-4 sm:p-5 mb-4">
          <div class="flex items-center justify-between mb-3">
            <div>
              <h3 class="text-sm font-bold text-[#0f294a]">软件与独立汇率管理</h3>
              <p class="text-xs text-[#5a6b82]">可随时新增其他软件，或单独调整各软件换算马币的汇率</p>
            </div>
            <button class="btn-navy btn-navy-primary px-3 py-1.5 text-xs" onclick="openPlatformModal()">+ 新增软件</button>
          </div>
          <div class="divide-y divide-[#e6edf6] mb-4">
      `;

      data.platforms.forEach(p => {
        const rateDisplay = p.mode === 'migo_usd'
          ? `1 USD = ${data.global.usdToMyr} MYR`
          : `1 币 = ${(Number(p.myrPerCoin) || 0).toFixed(6)} MYR`;
        html += `
          <div class="py-2.5 flex items-center justify-between gap-2">
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="text-xs px-2 py-0.5 rounded-md border font-semibold ${p.badge}">${escapeHtml(p.name)}</span>
                <span class="text-xs font-medium text-[#0f294a]">${rateDisplay}</span>
              </div>
              <div class="text-[11px] text-[#5a6b82] mt-0.5 truncate">${escapeHtml(getPlatformRuleText(p, data.global))}</div>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
              <button class="btn-navy px-2.5 py-1 text-xs" onclick="openPlatformModal('${p.id}')">改汇率/编辑</button>
              ${!p.builtin ? `<button class="btn-navy btn-navy-danger px-2 py-1 text-xs" onclick="delPlatform('${p.id}')">删除</button>` : ''}
            </div>
          </div>
        `;
      });

      html += `
          </div>
          <div class="flex flex-col sm:flex-row sm:items-end gap-3 pb-4 border-b border-[#e6edf6]">
            <div class="flex-1">
              <label class="block text-xs text-[#5a6b82] mb-1">Migo 美元汇率（1 USD 兑 MYR）</label>
              <div class="flex items-center gap-2">
                <span class="text-sm font-semibold text-[#0f294a]">1 USD =</span>
                <input type="number" step="0.01" min="0.01" id="usdRateInput" class="input-navy max-w-[140px]" value="${data.global.usdToMyr}">
                <span class="text-sm font-semibold text-[#0f294a]">MYR</span>
              </div>
            </div>
            <button class="btn-navy px-4 py-2 text-xs sm:text-sm" onclick="saveGlobalRate()">保存 Migo 汇率</button>
          </div>
          <div class="pt-3.5 flex flex-wrap items-center justify-between gap-2">
            <span class="text-xs text-[#5a6b82]">支持云端自动同步，也可手动导出 JSON 本地备份</span>
            <div class="flex gap-2">
              <button class="btn-navy px-3 py-1.5 text-xs" onclick="exportBackup()">导出备份</button>
              <button class="btn-navy px-3 py-1.5 text-xs" onclick="importBackup()">导入备份</button>
            </div>
          </div>
        </section>
      `;

      document.getElementById('app').innerHTML = html;
      updateSyncBadge();
    }

    function openPlatformModal(editId = null) {
      const p = editId ? data.platforms.find(x => x.id === editId) : null;
      const isMigo = p?.mode === 'migo_usd';
      openModal(`
        <h3 class="text-base font-bold text-[#0f294a] mb-3">${p ? '编辑软件与汇率' : '新增软件'}</h3>
        <form onsubmit="savePlatform(event, ${p ? `'${p.id}'` : 'null'})" class="space-y-3.5">
          <div>
            <label class="block text-xs font-semibold text-[#1e3a5f] mb-1">软件名称</label>
            <input type="text" id="platName" required class="input-navy" value="${escapeHtml(p?.name || '')}" placeholder="例如：Bigo">
          </div>
          ${isMigo ? `
            <p class="text-xs text-[#5a6b82] bg-[#f9fbfe] p-3 rounded-xl border border-[#dce4ef]">
              Migo 使用美元汇率换算，请在主界面修改「Migo 美元汇率」。
            </p>
          ` : `
            <div>
              <label class="block text-xs font-semibold text-[#1e3a5f] mb-1">1 金币换算马币（MYR）</label>
              <input type="number" step="0.000001" min="0" id="platRate" required class="input-navy" value="${p ? Number(p.myrPerCoin || 0) : ''}" placeholder="例如：0.003889">
            </div>
            <div>
              <label class="block text-xs font-semibold text-[#1e3a5f] mb-1">换算公式说明（可选）</label>
              <input type="text" id="platRule" class="input-navy" value="${escapeHtml(p?.ruleText || '')}" placeholder="例如：1 金币 = 0.004 MYR">
            </div>
          `}
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" class="btn-navy px-3.5 py-2 text-xs" onclick="closeModal()">取消</button>
            <button type="submit" class="btn-navy btn-navy-primary px-4 py-2 text-xs">保存</button>
          </div>
        </form>
      `);
    }

    function savePlatform(e, editId) {
      e.preventDefault();
      const name = document.getElementById('platName').value.trim();
      if (!name) return;

      if (editId) {
        const p = data.platforms.find(x => x.id === editId);
        if (!p) return;
        p.name = name;
        if (p.mode !== 'migo_usd') {
          const rate = parseFloat(document.getElementById('platRate').value);
          const rule = document.getElementById('platRule').value.trim();
          p.myrPerCoin = isNaN(rate) ? 0 : rate;
          p.customRateEdited = true;
          if (rule) p.ruleText = rule;
        }
      } else {
        const rate = parseFloat(document.getElementById('platRate').value);
        const rule = document.getElementById('platRule').value.trim();
        data.platforms.push({
          id: uuid(),
          name,
          badge: 'bg-slate-100 text-[#0f294a] border-slate-300',
          myrPerCoin: isNaN(rate) ? 0 : rate,
          ruleText: rule || `1 金币 = ${(isNaN(rate) ? 0 : rate).toFixed(6)} MYR`,
          customRateEdited: true,
          builtin: false
        });
      }

      save();
      closeModal();
      renderHome();
      showToast('软件设置已保存', 'success');
    }

    function delPlatform(id) {
      const p = data.platforms.find(x => x.id === id);
      if (!p || p.builtin) return;
      data.platforms = data.platforms.filter(x => x.id !== id);
      const fallbackId = data.platforms[0]?.id || 'miya';
      data.venues.forEach(v => {
        if (v.platform === id) v.platform = fallbackId;
      });
      save();
      renderHome();
      showToast('已删除软件', 'info');
    }

    function saveGlobalRate() {
      const val = parseFloat(document.getElementById('usdRateInput').value);
      if (isNaN(val) || val <= 0) {
        showToast('请输入有效的汇率数字', 'error');
        return;
      }
      data.global.usdToMyr = val;
      save();
      renderHome();
      showToast('Migo 汇率已更新', 'success');
    }

    function openVenueModal(editId = null) {
      const v = editId ? data.venues.find(x => x.id === editId) : null;
      const platOptions = data.platforms.map(p =>
        `<option value="${p.id}" ${(v?.platform || data.platforms[0]?.id) === p.id ? 'selected' : ''}>${escapeHtml(p.name)}</option>`
      ).join('');

      openModal(`
        <h3 class="text-base font-bold text-[#0f294a] mb-3">${v ? '编辑场地' : '新增场地'}</h3>
        <form onsubmit="saveVenue(event, ${v ? `'${v.id}'` : 'null'})" class="space-y-3.5">
          <div>
            <label class="block text-xs font-semibold text-[#1e3a5f] mb-1">场地名称</label>
            <input type="text" id="venueName" required class="input-navy" value="${escapeHtml(v?.name || '')}" placeholder="例如：星光大厅">
          </div>
          <div>
            <label class="block text-xs font-semibold text-[#1e3a5f] mb-1">所属软件</label>
            <select id="venuePlatform" class="input-navy">${platOptions}</select>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-[#1e3a5f] mb-1">营业开始</label>
              <input type="time" id="venueOpenStart" required class="input-navy" value="${v?.openStart || '20:00'}">
            </div>
            <div>
              <label class="block text-xs font-semibold text-[#1e3a5f] mb-1">营业结束</label>
              <input type="time" id="venueOpenEnd" required class="input-navy" value="${v?.openEnd || '02:00'}">
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-[#1e3a5f] mb-1">排档单价（币/档）</label>
              <input type="number" step="0.1" min="0" id="venueSchCoin" required class="input-navy" value="${v?.scheduleCoinPer ?? 100}">
            </div>
            <div>
              <label class="block text-xs font-semibold text-[#1e3a5f] mb-1">主持单价（币/小时）</label>
              <input type="number" step="0.1" min="0" id="venueHostCoin" required class="input-navy" value="${v?.hostCoinPerHour ?? 100}">
            </div>
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" class="btn-navy px-3.5 py-2 text-xs" onclick="closeModal()">取消</button>
            <button type="submit" class="btn-navy btn-navy-primary px-4 py-2 text-xs">保存</button>
          </div>
        </form>
      `);
    }

    function saveVenue(e, editId) {
      e.preventDefault();
      const name = document.getElementById('venueName').value.trim();
      const platform = document.getElementById('venuePlatform').value;
      const openStart = document.getElementById('venueOpenStart').value;
      const openEnd = document.getElementById('venueOpenEnd').value;
      const scheduleCoinPer = parseFloat(document.getElementById('venueSchCoin').value) || 0;
      const hostCoinPerHour = parseFloat(document.getElementById('venueHostCoin').value) || 0;
      if (!name) return;

      if (editId) {
        const v = data.venues.find(x => x.id === editId);
        if (!v) return;
        Object.assign(v, { name, platform, openStart, openEnd, scheduleCoinPer, hostCoinPerHour });
      } else {
        data.venues.push({
          id: uuid(),
          name,
          platform,
          openStart,
          openEnd,
          scheduleCoinPer,
          hostCoinPerHour,
          scheduleList: [],
          hostList: []
        });
      }

      save();
      closeModal();
      if (currentVenueId) renderVenue();
      else renderHome();
      showToast('场地已保存', 'success');
    }

    function confirmDelVenue(id) {
      const v = data.venues.find(x => x.id === id);
      if (!v) return;
      openModal(`
        <h3 class="text-base font-bold text-[#0f294a] mb-2">确认删除场地</h3>
        <p class="text-xs text-[#5a6b82] mb-4">确定要删除「${escapeHtml(v.name)}」及其所有排档与主持记录吗？此操作无法撤销。</p>
        <div class="flex justify-end gap-2">
          <button type="button" class="btn-navy px-3.5 py-2 text-xs" onclick="closeModal()">取消</button>
          <button type="button" class="btn-navy btn-navy-primary px-4 py-2 text-xs" onclick="delVenue('${id}')">确认删除</button>
        </div>
      `);
    }

    function delVenue(id) {
      data.venues = data.venues.filter(x => x.id !== id);
      if (currentVenueId === id) currentVenueId = null;
      save();
      closeModal();
      renderCurrentView();
      showToast('场地已删除', 'info');
    }

    function openVenue(id) {
      currentVenueId = id;
      currentTab = 'schedule';
      selectedScheduleDate = getTodayDateStr();
      selectedHostDate = getTodayDateStr();
      showCustomHostForm = false;
      renderVenue();
    }

    function switchTab(tab) {
      currentTab = tab;
      renderVenue();
    }

    function toggleScheduleSlot(hour) {
      const v = data.venues.find(x => x.id === currentVenueId);
      if (!v) return;
      const idx = v.scheduleList.findIndex(s => s.date === selectedScheduleDate && s.hour === hour);
      if (idx >= 0) {
        v.scheduleList[idx].checked = !v.scheduleList[idx].checked;
        if (!v.scheduleList[idx].checked) v.scheduleList.splice(idx, 1);
      } else {
        v.scheduleList.push({ id: uuid(), date: selectedScheduleDate, hour, checked: true });
      }
      save();
      renderVenue();
    }

    function addHostSlot(hour) {
      const v = data.venues.find(x => x.id === currentVenueId);
      if (!v) return;
      const label = `${String(hour).padStart(2, '0')}:00 - ${String((hour + 1) % 24).padStart(2, '0')}:00`;
      v.hostList.unshift({
        id: uuid(),
        date: selectedHostDate,
        hour,
        label,
        hours: 1
      });
      save();
      renderVenue();
      showToast(`已记录 ${label} (1h)`, 'success');
    }

    function addCustomHost(e) {
      e.preventDefault();
      const v = data.venues.find(x => x.id === currentVenueId);
      if (!v) return;
      const hrs = parseFloat(document.getElementById('customHostHours').value);
      const note = document.getElementById('customHostNote').value.trim();
      if (isNaN(hrs) || hrs <= 0) {
        showToast('请输入大于 0 的小时数', 'error');
        return;
      }
      v.hostList.unshift({
        id: uuid(),
        date: selectedHostDate,
        label: note || `自定义时长`,
        hours: hrs
      });
      showCustomHostForm = false;
      save();
      renderVenue();
      showToast(`已添加主持 ${hrs}h`, 'success');
    }

    function delHostRecord(recId) {
      const v = data.venues.find(x => x.id === currentVenueId);
      if (!v) return;
      v.hostList = v.hostList.filter(h => h.id !== recId);
      save();
      renderVenue();
      showToast('已删除主持记录', 'info');
    }

    function renderVenue() {
      const v = data.venues.find(x => x.id === currentVenueId);
      if (!v) return renderHome();
      const p = getPlatformById(v.platform);
      const st = calcVenueStat(v);
      const opHours = getOperatingHours(v.openStart, v.openEnd);
      const allHours = Array.from({ length: 24 }, (_, i) => i);
      const displayHours = hostHoursOnlyOperating ? opHours : allHours;

      const daySchList = v.scheduleList.filter(s => s.date === selectedScheduleDate && s.checked);
      const dayHostList = v.hostList.filter(h => h.date === selectedHostDate);
      const dayHostHours = dayHostList.reduce((acc, h) => acc + getHostRecordHours(h), 0);

      let html = `
        <div class="navy-card px-3.5 py-2.5 mb-4 flex flex-wrap items-center justify-between gap-2 text-xs">
          <button class="btn-navy px-2.5 py-1 text-xs" onclick="renderHome()">← 返回总览</button>
          <div class="flex items-center gap-2">
            <span id="sync-status-badge"></span>
            <button class="btn-navy px-2.5 py-1 text-xs" onclick="openVenueModal('${v.id}')">场地设置</button>
          </div>
        </div>

        <section class="navy-card p-4 sm:p-5 mb-4">
          <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
            <div class="flex items-center gap-2">
              <h1 class="text-xl font-bold text-[#0f294a]">${escapeHtml(v.name)}</h1>
              <span class="text-xs px-2 py-0.5 rounded-md border font-semibold ${p.badge}">${escapeHtml(p.name)}</span>
            </div>
            <span class="text-xs text-[#5a6b82]">营业 ${v.openStart} ~ ${v.openEnd}</span>
          </div>
          <div class="grid grid-cols-3 gap-2 pt-2 border-t border-[#e6edf6] text-center">
            <div class="bg-[#f9fbfe] rounded-xl p-2.5">
              <div class="text-[11px] text-[#5a6b82]">今日收益</div>
              <div class="text-sm font-bold text-[#0f294a] mt-0.5">RM ${st.myrToday.toFixed(2)}</div>
              <div class="text-[10px] text-[#5a6b82]">${st.totalToday.toFixed(0)} 币</div>
            </div>
            <div class="bg-[#f9fbfe] rounded-xl p-2.5">
              <div class="text-[11px] text-[#5a6b82]">本周收益</div>
              <div class="text-sm font-bold text-[#2563eb] mt-0.5">RM ${st.myrWeek.toFixed(2)}</div>
              <div class="text-[10px] text-[#5a6b82]">${st.weekSchCount}档 / ${st.weekHostHours.toFixed(1)}h</div>
            </div>
            <div class="bg-[#f9fbfe] rounded-xl p-2.5">
              <div class="text-[11px] text-[#5a6b82]">累计收益</div>
              <div class="text-sm font-bold text-[#0f294a] mt-0.5">RM ${st.myr.toFixed(2)}</div>
              <div class="text-[10px] text-[#5a6b82]">${st.totalCoin.toFixed(0)} 币</div>
            </div>
          </div>
        </section>

        <div class="grid grid-cols-2 bg-[#e2eaf5] p-1 rounded-xl mb-4">
          <button type="button" onclick="switchTab('schedule')" class="py-2 text-xs sm:text-sm font-semibold rounded-lg transition ${currentTab === 'schedule' ? 'bg-[#0f294a] text-white shadow-sm' : 'text-[#1e3a5f]'}">排档打卡 (${v.scheduleCoinPer}币/档)</button>
          <button type="button" onclick="switchTab('host')" class="py-2 text-xs sm:text-sm font-semibold rounded-lg transition ${currentTab === 'host' ? 'bg-[#0f294a] text-white shadow-sm' : 'text-[#1e3a5f]'}">主持记录 (${v.hostCoinPerHour}币/h)</button>
        </div>
      `;

      if (currentTab === 'schedule') {
        html += `
          <section class="navy-card p-4 sm:p-5">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
              <div>
                <h2 class="text-sm font-bold text-[#0f294a]">排档小时格</h2>
                <p class="text-xs text-[#5a6b82]">点击小时格切换打卡状态（当日已选 ${daySchList.length} 档）</p>
              </div>
              <input type="date" class="input-navy max-w-[165px] text-xs" value="${selectedScheduleDate}" onchange="selectedScheduleDate = this.value; renderVenue();">
            </div>
            <div class="grid grid-cols-3 sm:grid-cols-4 gap-2">
        `;
        opHours.forEach(h => {
          const checked = daySchList.some(s => s.hour === h);
          const label = `${String(h).padStart(2, '0')}:00`;
          html += `
            <div class="slot-box ${checked ? 'checked' : ''}" onclick="toggleScheduleSlot(${h})">
              <div class="text-sm font-bold">${label}</div>
              <div class="slot-sub text-[11px] text-[#5a6b82] mt-0.5">${checked ? '已排档' : `+${v.scheduleCoinPer}币`}</div>
            </div>
          `;
        });
        html += `</div></section>`;
      } else {
        html += `
          <section class="navy-card p-4 sm:p-5 mb-4">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
              <div>
                <h2 class="text-sm font-bold text-[#0f294a]">快捷记录主持（1h/格）</h2>
                <p class="text-xs text-[#5a6b82]">当日已记 ${dayHostHours.toFixed(1)}h · ${(dayHostHours * (Number(v.hostCoinPerHour) || 0)).toFixed(0)} 币</p>
              </div>
              <div class="flex items-center gap-2">
                <input type="date" class="input-navy max-w-[160px] text-xs" value="${selectedHostDate}" onchange="selectedHostDate = this.value; renderVenue();">
                <button type="button" class="btn-navy px-2.5 py-2 text-xs" onclick="hostHoursOnlyOperating = !hostHoursOnlyOperating; renderVenue();">
                  ${hostHoursOnlyOperating ? '显示24h' : '仅营业时段'}
                </button>
              </div>
            </div>
            <div class="grid grid-cols-4 sm:grid-cols-6 gap-2 mb-3">
        `;
        displayHours.forEach(h => {
          const label = `${String(h).padStart(2, '0')}:00`;
          html += `
            <button type="button" class="slot-box" onclick="addHostSlot(${h})">
              <div class="text-xs font-bold">${label}</div>
              <div class="slot-sub text-[10px] text-[#5a6b82] mt-0.5">+1h</div>
            </button>
          `;
        });
        html += `</div>`;

        if (!showCustomHostForm) {
          html += `<button type="button" class="btn-navy px-3 py-1.5 text-xs" onclick="showCustomHostForm = true; renderVenue();">+ 添加自定义时长/备注</button>`;
        } else {
          html += `
            <form onsubmit="addCustomHost(event)" class="p-3 rounded-xl bg-[#f9fbfe] border border-[#dce4ef] space-y-2.5 mt-2">
              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="block text-[11px] text-[#5a6b82] mb-1">时长（小时）</label>
                  <input type="number" step="0.5" min="0.5" id="customHostHours" required class="input-navy text-xs" placeholder="例如：1.5">
                </div>
                <div>
                  <label class="block text-[11px] text-[#5a6b82] mb-1">备注（可选）</label>
                  <input type="text" id="customHostNote" class="input-navy text-xs" placeholder="例如：晚场加时">
                </div>
              </div>
              <div class="flex justify-end gap-2">
                <button type="button" class="btn-navy px-3 py-1.5 text-xs" onclick="showCustomHostForm = false; renderVenue();">取消</button>
                <button type="submit" class="btn-navy btn-navy-primary px-3 py-1.5 text-xs">添加</button>
              </div>
            </form>
          `;
        }
        html += `</section>`;

        html += `<section class="navy-card p-4 sm:p-5"><h3 class="text-sm font-bold text-[#0f294a] mb-2.5">${selectedHostDate} 主持明细</h3>`;
        if (dayHostList.length === 0) {
          html += `<p class="text-xs text-[#5a6b82]">该日期暂无主持记录</p>`;
        } else {
          html += `<div class="divide-y divide-[#e6edf6]">`;
          dayHostList.forEach(h => {
            const hrs = getHostRecordHours(h);
            const coins = hrs * (Number(v.hostCoinPerHour) || 0);
            html += `
              <div class="py-2 flex items-center justify-between gap-2 text-xs">
                <div>
                  <span class="font-semibold text-[#0f294a]">${escapeHtml(h.label || '主持')}</span>
                  <span class="text-[#5a6b82] ml-2">${hrs}h · ${coins.toFixed(0)}币</span>
                </div>
                <button type="button" class="btn-navy btn-navy-danger px-2 py-1 text-xs" onclick="delHostRecord('${h.id}')">删除</button>
              </div>
            `;
          });
          html += `</div>`;
        }
        html += `</section>`;
      }

      document.getElementById('app').innerHTML = html;
      updateSyncBadge();
    }

    function exportBackup() {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `排档主持备份_${getTodayDateStr()}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('已导出 JSON 备份文件', 'success');
    }

    function importBackup() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json,application/json';
      input.onchange = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const text = await file.text();
          data = normalizeData(JSON.parse(text));
          save();
          renderCurrentView();
          showToast('备份导入成功', 'success');
        } catch (err) {
          showToast('备份文件格式无效', 'error');
        }
      };
      input.click();
    }

    supabaseClient.auth.onAuthStateChange(async (_event, session) => {
      const nextUser = session?.user || null;
      const changed = nextUser?.id !== currentUser?.id;
      currentUser = nextUser;
      if (currentUser && changed) {
        await pullDataFromCloud(false);
      } else if (!currentUser) {
        renderAuthScreen();
      }
    });

    (async function init() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session?.user) {
        currentUser = session.user;
        await pullDataFromCloud(false);
      } else {
        renderAuthScreen();
      }
    })();
  </script>
</body>
</html>
