<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的排档主持记录</title>
  <!-- 引入 Tailwind CSS 实现现代响应式布局 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 Inter 与 Noto Sans SC 字体提升中英文排版清晰度 -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* 深蓝白主题设计令牌 */
    :root {
      --navy-deep: #0f294a;
      --navy-mid: #1e3a5f;
      --navy-hover: #163052;
      --blue-bright: #2563eb;
      --blue-soft: #e8f0fe;
      --bg-ice: #f4f7fb;
      --card-white: #ffffff;
      --border-slate: #dce4ef;
      --text-primary: #0f294a;
      --text-secondary: #5a6b82;
    }

    * {
      box-sizing: border-box;
      font-family: "Inter", "Noto Sans SC", system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-ice);
      color: var(--text-primary);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }

    /* 洁白卡片与细边框微阴影 */
    .navy-card {
      background: var(--card-white);
      border: 1px solid var(--border-slate);
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(15, 41, 74, 0.04);
    }

    /* 通用按钮样式 */
    .btn-navy {
      border: 1px solid #c7d4e6;
      background: #ffffff;
      color: var(--navy-deep);
      border-radius: 10px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.16s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-navy:hover {
      background: #eef4fc;
      border-color: #9cb3d3;
    }

    .btn-navy:active {
      transform: scale(0.98);
    }

    .btn-navy-primary {
      background: var(--navy-deep);
      border-color: var(--navy-deep);
      color: #ffffff;
    }

    .btn-navy-primary:hover {
      background: var(--navy-hover);
      border-color: var(--navy-hover);
    }

    .btn-navy-danger {
      color: #c62828;
      border-color: transparent;
      background: transparent;
    }

    .btn-navy-danger:hover {
      background: #fdecec;
      border-color: #f8caca;
    }

    /* 表单输入控件 */
    .input-navy {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #cbd6e6;
      border-radius: 10px;
      font-size: 14px;
      background: #f9fbfe;
      color: var(--navy-deep);
      outline: none;
      transition: border-color 0.18s ease, background-color 0.18s ease;
    }

    .input-navy:focus {
      border-color: var(--blue-bright);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    /* 小时打卡格子样式 */
    .slot-box {
      border: 1px solid #d5dfed;
      background: #f9fbfe;
      color: var(--navy-deep);
      border-radius: 10px;
      padding: 10px 6px;
      text-align: center;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }

    .slot-box:hover {
      border-color: #7da1d4;
      background: #eef5ff;
    }

    .slot-box.checked {
      background: var(--navy-deep);
      border-color: var(--navy-deep);
      color: #ffffff;
      box-shadow: 0 3px 8px rgba(15, 41, 74, 0.22);
    }

    .slot-box.checked .slot-sub {
      color: #b8d0f0;
    }

    /* Toast 动画 */
    @keyframes toastIn {
      from { opacity: 0; transform: translate(-50%, -14px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    .toast-banner {
      animation: toastIn 0.22s ease forwards;
    }

    /* 模态框背景 */
    .modal-overlay {
      background: rgba(15, 41, 74, 0.45);
      backdrop-filter: blur(2px);
    }
  </style>
</head>
<body class="pb-14">

  <!-- 顶部 Toast 提示容器 -->
  <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 pointer-events-none flex flex-col gap-2 w-11/12 max-w-sm"></div>

  <!-- 主应用挂载点 -->
  <div id="app" class="max-w-3xl mx-auto px-4 pt-6 sm:pt-8"></div>

  <!-- 模态框容器 -->
  <div id="modal-root" class="fixed inset-0 z-40 hidden items-center justify-center p-4 modal-overlay"></div>

  <script>
    /**
     * =========================================================
     * 1. 存储、默认软件与动态汇率配置
     * =========================================================
     */
    const STORAGE_KEY = 'schedule_host_record';

    // 默认内置软件配置（保留原有 Miya / Momi / Migo 换算逻辑，且支持用户新增与改汇率）
    function getDefaultPlatforms() {
      return [
        {
          id: 'miya',
          name: 'Miya',
          badge: 'bg-blue-50 text-[#0f294a] border-blue-200',
          // 魅力值 = 金币 * 0.7，马币 = 魅力值 / 180 => 每1金币约合 (0.7 / 180) 马币
          myrPerCoin: 0.7 / 180,
          ruleText: '魅力值 = 金币 × 0.7 | 马币 = 魅力值 ÷ 180',
          builtin: true
        },
        {
          id: 'momi',
          name: 'Momi',
          badge: 'bg-indigo-50 text-[#1e3a5f] border-indigo-200',
          // 魅力值 = 金币 * 0.7，马币 = 魅力值 / 10000 * 52 => 每1金币约合 (0.7 / 10000 * 52) 马币
          myrPerCoin: (0.7 / 10000) * 52,
          ruleText: '魅力值 = 金币 × 0.7 | 马币 = 魅力值 ÷ 10000 × 52',
          builtin: true
        },
        {
          id: 'migo',
          name: 'Migo',
          badge: 'bg-sky-50 text-[#0f294a] border-sky-200',
          // 礼物值 = 金币 * 2.8，美元 = 礼物值 / 40000，马币 = 美元 * usdToMyr
          mode: 'migo_usd',
          myrPerCoin: null,
          ruleText: '礼物值 = 金币 × 2.8 | 美元 = 礼物值 ÷ 40000 | 马币 = 美元 × 汇率',
          builtin: true
        }
      ];
    }

    function getPlatformById(platformId) {
      const found = data.platforms.find(p => p.id === platformId);
      if (found) return found;
      return data.platforms[0] || getDefaultPlatforms()[0];
    }

    function getPlatformRuleText(p, globalCfg) {
      if (!p) return '';
      if (p.mode === 'migo_usd') {
        const rate = Number(globalCfg?.usdToMyr) || 4.6;
        return `礼物值 = 金币 × 2.8 | 美元 = 礼物值 ÷ 40000 | 马币 = 美元 × ${rate}`;
      }
      const rate = Number(p.myrPerCoin) || 0;
      if (p.ruleText && !p.customRateEdited) return p.ruleText;
      return `换算率：1 金币 = ${rate.toFixed(6)} MYR`;
    }

    function calcCoinsToMyr(coins, platformId, globalCfg) {
      const p = getPlatformById(platformId);
      const safeCoins = Number(coins) || 0;
      if (p && p.mode === 'migo_usd') {
        const gift = safeCoins * 2.8;
        const usd = gift / 40000;
        const rate = Number(globalCfg?.usdToMyr) || 4.6;
        return usd * rate;
      }
      const rate = Number(p?.myrPerCoin) || 0;
      return safeCoins * rate;
    }

    // 加载并校验本地数据，兼容旧结构
    function loadData() {
      const fallback = {
        venues: [],
        global: { usdToMyr: 4.6 },
        platforms: getDefaultPlatforms()
      };
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return fallback;
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== 'object') return fallback;

        if (!Array.isArray(parsed.venues)) parsed.venues = [];
        if (!parsed.global || typeof parsed.global.usdToMyr !== 'number' || isNaN(parsed.global.usdToMyr)) {
          parsed.global = { usdToMyr: 4.6 };
        }

        // 合并并校验 platforms
        if (!Array.isArray(parsed.platforms) || parsed.platforms.length === 0) {
          parsed.platforms = getDefaultPlatforms();
        } else {
          const defaults = getDefaultPlatforms();
          defaults.forEach(def => {
            const exists = parsed.platforms.find(x => x.id === def.id);
            if (!exists) {
              parsed.platforms.unshift(def);
            } else {
              if (!exists.name) exists.name = def.name;
              if (!exists.badge) exists.badge = def.badge;
              if (def.mode === 'migo_usd') {
                exists.mode = 'migo_usd';
              } else if (typeof exists.myrPerCoin !== 'number' || isNaN(exists.myrPerCoin)) {
                exists.myrPerCoin = def.myrPerCoin;
              }
            }
          });
          parsed.platforms.forEach(p => {
            if (!p.id) p.id = uuid();
            if (!p.name) p.name = '未命名软件';
            if (!p.badge) p.badge = 'bg-slate-100 text-[#0f294a] border-slate-300';
            if (p.mode !== 'migo_usd' && (typeof p.myrPerCoin !== 'number' || isNaN(p.myrPerCoin))) {
              p.myrPerCoin = 0;
            }
          });
        }

        const validIds = new Set(parsed.platforms.map(p => p.id));
        parsed.venues.forEach(v => {
          if (!Array.isArray(v.scheduleList)) v.scheduleList = [];
          if (!Array.isArray(v.hostList)) v.hostList = [];
          if (!validIds.has(v.platform)) {
            v.platform = parsed.platforms[0]?.id || 'miya';
          }
        });

        return parsed;
      } catch (err) {
        console.error('读取本地数据异常:', err);
        return fallback;
      }
    }

    let data = loadData();

    // 页面与交互状态
    let currentVenueId = null;
    let currentTab = 'schedule'; // 'schedule' | 'host'
    let selectedScheduleDate = getTodayDateStr(); // 排档打卡日期
    let selectedHostDate = getTodayDateStr();     // 主持小时格打卡日期
    let hostHoursOnlyOperating = false;         // 主持格子是否仅显示场地营业时段
    let showCustomHostForm = false;             // 是否展开备用的自定义时段/时长表单

    /**
     * =========================================================
     * 2. 日历与时间工具函数（严格按自然日历日期归属）
     * =========================================================
     */
    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (err) {
        showToast('保存到本地存储失败', 'error');
      }
    }

    function uuid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    // 格式化 Date 为本地自然日历 YYYY-MM-DD
    function formatDateStr(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    // 获取当前自然日历“今天”
    function getTodayDateStr() {
      return formatDateStr(new Date());
    }

    // 获取当前自然日历“本周一”日期字符串（周一至周日为一个自然周）
    function getWeekStartDateStr() {
      const now = new Date();
      const dayOfWeek = now.getDay(); // 周日为0，周一~周六为1~6
      const diffToMonday = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
      const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - diffToMonday);
      return formatDateStr(monday);
    }

    // 解析营业时段小时数组（防死循环，支持跨夜与非整点结束）
    function getOperatingHours(openStart, openEnd) {
      if (!openStart || !openEnd || !openStart.includes(':') || !openEnd.includes(':')) {
        return [20, 21, 22, 23, 0, 1];
      }
      const [sh, sm] = openStart.split(':').map(Number);
      const [eh, em] = openEnd.split(':').map(Number);
      if ([sh, sm, eh, em].some(n => isNaN(n))) {
        return [20, 21, 22, 23, 0, 1];
      }
      if (sh === eh && sm === em) {
        return [sh];
      }
      const startMin = sh * 60 + sm;
      let endMin = eh * 60 + em;
      if (endMin <= startMin) {
        endMin += 24 * 60;
      }
      const slotCount = Math.min(24, Math.max(1, Math.ceil((endMin - startMin) / 60)));
      const list = [];
      for (let i = 0; i < slotCount; i++) {
        list.push((sh + i) % 24);
      }
      return list;
    }

    /**
     * 计算单条主持记录的时长（小时）与金币
     */
    function getHostRecordHours(h) {
      if (typeof h.hours === 'number' && !isNaN(h.hours) && h.hours >= 0) {
        return h.hours;
      }
      const diff = (new Date(h.endTime).getTime() - new Date(h.startTime).getTime()) / 3600000;
      return isNaN(diff) || diff < 0 ? 0 : diff;
    }

    /**
     * 计算单个场地的今日、本周、累计统计
     */
    function calcVenueStat(venue) {
      const today = getTodayDateStr();
      const weekStart = getWeekStartDateStr();
      const schPrice = Number(venue.scheduleCoinPer) || 0;
      const hostPrice = Number(venue.hostCoinPerHour) || 0;

      let schCoin = 0, schToday = 0, schWeek = 0;
      venue.scheduleList.forEach(s => {
        if (!s || !s.checked) return;
        schCoin += schPrice;
        if (s.date === today) schToday += schPrice;
        if (s.date >= weekStart) schWeek += schPrice;
      });

      let hostCoin = 0, hostToday = 0, hostWeek = 0, totalHostHours = 0;
      venue.hostList.forEach(h => {
        if (!h) return;
        const hrs = getHostRecordHours(h);
        const c = hrs * hostPrice;
        totalHostHours += hrs;
        hostCoin += c;
        if (h.date === today) hostToday += c;
        if (h.date >= weekStart) hostWeek += c;
      });

      const totalCoin = schCoin + hostCoin;
      const totalToday = schToday + hostToday;
      const totalWeek = schWeek + hostWeek;

      return {
        schCoin,
        hostCoin,
        totalCoin,
        schToday,
        hostToday,
        totalToday,
        schWeek,
        hostWeek,
        totalWeek,
        totalHostHours,
        myr: calcCoinsToMyr(totalCoin, venue.platform, data.global),
        myrToday: calcCoinsToMyr(totalToday, venue.platform, data.global),
        myrWeek: calcCoinsToMyr(totalWeek, venue.platform, data.global)
      };
    }

    /**
     * 按软件分开统计各软件今日、本周、累计金币与马币，并计算本周马币总计
     */
    function calcByPlatformStat() {
      const map = {};
      data.platforms.forEach(p => {
        map[p.id] = {
          platform: p,
          todayCoin: 0,
          weekCoin: 0,
          allCoin: 0,
          todayMyr: 0,
          weekMyr: 0,
          allMyr: 0,
          venueCount: 0
        };
      });

      data.venues.forEach(v => {
        const pid = getPlatformById(v.platform).id;
        if (!map[pid]) {
          map[pid] = {
            platform: getPlatformById(pid),
            todayCoin: 0,
            weekCoin: 0,
            allCoin: 0,
            todayMyr: 0,
            weekMyr: 0,
            allMyr: 0,
            venueCount: 0
          };
        }
        const st = calcVenueStat(v);
        map[pid].venueCount += 1;
        map[pid].todayCoin += st.totalToday;
        map[pid].weekCoin += st.totalWeek;
        map[pid].allCoin += st.totalCoin;
      });

      let weekTotalMyr = 0;
      const list = Object.values(map).map(item => {
        item.todayMyr = calcCoinsToMyr(item.todayCoin, item.platform.id, data.global);
        item.weekMyr = calcCoinsToMyr(item.weekCoin, item.platform.id, data.global);
        item.allMyr = calcCoinsToMyr(item.allCoin, item.platform.id, data.global);
        weekTotalMyr += item.weekMyr;
        return item;
      });

      return { list, weekTotalMyr };
    }

    /**
     * =========================================================
     * 3. 提示与模态框辅助组件
     * =========================================================
     */
    function showToast(msg, type = 'info') {
      const container = document.getElementById('toast-container');
      const el = document.createElement('div');
      const styles = {
        success: 'bg-[#0f294a] text-white border-[#1e3a5f]',
        error: 'bg-[#b91c1c] text-white border-[#991b1b]',
        info: 'bg-[#1e3a5f] text-white border-[#0f294a]'
      };
      el.className = `toast-banner px-4 py-2.5 rounded-xl shadow-lg border text-xs sm:text-sm font-medium text-center ${styles[type] || styles.info}`;
      el.textContent = msg;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.2s ease';
        setTimeout(() => el.remove(), 220);
      }, 2300);
    }

    function openModal(innerHtml) {
      const root = document.getElementById('modal-root');
      root.innerHTML = `<div class="navy-card w-full max-w-md p-5 sm:p-6 shadow-2xl">${innerHtml}</div>`;
      root.classList.remove('hidden');
      root.classList.add('flex');
    }

    function closeModal() {
      const root = document.getElementById('modal-root');
      root.classList.add('hidden');
      root.classList.remove('flex');
      root.innerHTML = '';
    }

    document.getElementById('modal-root').addEventListener('click', (e) => {
      if (e.target.id === 'modal-root') closeModal();
    });

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    /**
     * =========================================================
     * 4. 首页渲染、各软件分开统计、自定义软件与独立汇率
     * =========================================================
     */
    function renderHome() {
      currentVenueId = null;
      const { list: platformStats, weekTotalMyr } = calcByPlatformStat();
      const todayStr = getTodayDateStr();
      const weekStartStr = getWeekStartDateStr();

      let html = `
        <header class="text-center mb-6">
          <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white border border-[#dce4ef] text-xs font-medium text-[#1e3a5f] mb-2">
            <span>自然日历计账 · 00:00 独立分日</span>
          </div>
          <h1 class="text-2xl font-bold tracking-wide text-[#0f294a]">我的排档主持记录</h1>
          <p class="text-xs text-[#5a6b82] mt-1">今日日历：${todayStr} · 本周起算：${weekStartStr} (周一)</p>
        </header>

        <!-- 各软件分开统计区 + 底部一行轻量本周马币小字总结 -->
        <section class="navy-card p-4 sm:p-5 mb-4">
          <div class="flex items-center justify-between mb-2.5">
            <h2 class="text-xs font-bold uppercase tracking-wider text-[#1e3a5f]">各软件赚取明细（分开算）</h2>
            <span class="text-xs text-[#5a6b82]">Migo 汇率：1 USD = ${data.global.usdToMyr} MYR</span>
          </div>

          <div class="divide-y divide-[#e6edf6]">
      `;

      platformStats.forEach(item => {
        const p = item.platform;
        html += `
          <div class="py-2.5 flex flex-col sm:flex-row sm:items-center justify-between gap-1.5">
            <div class="flex items-center gap-2">
              <span class="text-xs px-2 py-0.5 rounded-md border font-semibold ${p.badge}">${escapeHtml(p.name)}</span>
              <span class="text-xs text-[#5a6b82]">${item.venueCount} 个场地</span>
            </div>
            <div class="text-xs sm:text-sm text-[#0f294a] flex flex-wrap items-center gap-x-3 gap-y-1">
              <span>今日：<strong>RM ${item.todayMyr.toFixed(2)}</strong> <span class="text-[11px] text-[#5a6b82]">(${item.todayCoin.toFixed(1)}币)</span></span>
              <span>本周：<strong class="text-[#2563eb]">RM ${item.weekMyr.toFixed(2)}</strong> <span class="text-[11px] text-[#5a6b82]">(${item.weekCoin.toFixed(1)}币)</span></span>
              <span>累计：<strong>RM ${item.allMyr.toFixed(2)}</strong></span>
            </div>
          </div>
        `;
      });

      html += `
          </div>

          <div class="pt-3 mt-1 border-t border-[#e6edf6] flex items-center justify-between text-xs text-[#5a6b82]">
            <span>各软件独立换算后汇总</span>
            <span>本周总共：<strong class="text-[#0f294a]">RM ${weekTotalMyr.toFixed(2)}</strong></span>
          </div>
        </section>

        <!-- 场地列表 -->
        <section class="navy-card p-4 sm:p-5 mb-4">
          <div class="flex items-center justify-between mb-4">
            <div>
              <h2 class="text-base font-bold text-[#0f294a]">场地列表 (${data.venues.length})</h2>
              <p class="text-xs text-[#5a6b82]">选择场地进行排档与主持小时格打卡</p>
            </div>
            <button class="btn-navy btn-navy-primary px-3.5 py-2 text-xs sm:text-sm" onclick="openVenueModal()">
              + 新增场地
            </button>
          </div>
      `;

      if (data.venues.length === 0) {
        html += `
          <div class="text-center py-10 px-4 rounded-xl border border-dashed border-[#c7d4e6] bg-[#f9fbfe]">
            <p class="text-sm text-[#5a6b82] mb-3">还没有添加任何场地</p>
            <button class="btn-navy btn-navy-primary px-4 py-2 text-xs sm:text-sm" onclick="openVenueModal()">立即新增场地</button>
          </div>
        `;
      } else {
        html += `<div class="space-y-2.5">`;
        data.venues.forEach(v => {
          const p = getPlatformById(v.platform);
          const st = calcVenueStat(v);

      html += `
          </div>

          <div class="flex flex-col sm:flex-row sm:items-end gap-3 pb-4 border-b border-[#e6edf6]">

    // 新增或编辑软件及独立马币汇率
    function openPlatformModal(editId = null) {
      const isEdit = Boolean(editId);
      const target = isEdit ? getPlatformById(editId) : {
        id: '',
        name: '',
        myrPerCoin: 0.01,
        mode: 'direct',
        builtin: false
      };
      if (!target) return;

      const isMigo = target.mode === 'migo_usd';

      openModal(`
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-lg font-bold text-[#0f294a]">${isEdit ? '编辑软件与汇率' : '新增软件'}</h3>
          <button class="text-[#5a6b82] hover:text-[#0f294a] text-xl leading-none px-1" onclick="closeModal()">&times;</button>

        <div class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-[#1e3a5f] mb-1">软件名称</label>

          </div>
          ${isMigo ? `
            <div class="p-3 rounded-xl bg-[#f4f7fb] border border-[#dce4ef] text-xs text-[#1e3a5f]">
              Migo 使用下方全局「1 USD 兑 MYR」汇率进行换算（礼物值 = 金币 × 2.8，美元 = 礼物值 ÷ 40000）。
            </div>
          ` : `
            <div>
              <label class="block text-xs font-semibold text-[#1e3a5f] mb-1">换算方式（任选一种填入）</label>
              <div class="grid grid-cols-1 gap-2.5 bg-[#f9fbfe] p-3 rounded-xl border border-[#dce4ef]">
                <div>
                  <span class="block text-[11px] text-[#5a6b82] mb-1">方式 A：直接填「1 金币 = 多少马币 (MYR)」</span>
                  <input type="number" step="0.000001" min="0" id="pMyrPerCoin" class="input-navy text-xs" value="${Number(target.myrPerCoin) || 0}">
                </div>
                <div>
                  <span class="block text-[11px] text-[#5a6b82] mb-1">方式 B：按「多少金币/积分 = 1 马币 (MYR)」填除数（填后自动算上方单价）</span>
                  <input type="number" step="0.01" min="0" id="pCoinsPerMyr" class="input-navy text-xs" placeholder="例如 100 表示 100 币 = 1 马币" oninput="syncRateFromDivisor()">

              </div>
            </div>

            ${isEdit ? '保存设置' : '确认添加'}
          </button>
        </div>
      `);
    }

    function syncRateFromDivisor() {
      const divInput = document.getElementById('pCoinsPerMyr');
      const rateInput = document.getElementById('pMyrPerCoin');
      if (!divInput || !rateInput) return;
      const divisor = parseFloat(divInput.value);
      if (!isNaN(divisor) && divisor > 0) {
        rateInput.value = (1 / divisor).toFixed(6);
      }
    }

    function savePlatformModal(editId) {
      const name = document.getElementById('pName').value.trim();
      if (!name) {
        showToast('请填写软件名称', 'error');
        return;
      }

      if (editId) {
        const p = data.platforms.find(x => x.id === editId);
        if (!p) return;
        p.name = name;
        if (p.mode !== 'migo_usd') {
          const rate = parseFloat(document.getElementById('pMyrPerCoin').value);
          if (isNaN(rate) || rate < 0) {
            showToast('请填写有效的马币换算率', 'error');
            return;
          }
          p.myrPerCoin = rate;
          p.customRateEdited = true;
        }
        save();
        closeModal();
        renderHome();
        showToast(`已更新软件「${name}」`, 'success');
      } else {
        const rate = parseFloat(document.getElementById('pMyrPerCoin').value);
        if (isNaN(rate) || rate < 0) {
          showToast('请填写有效的马币换算率', 'error');
          return;
        }
        const badges = [
          'bg-blue-50 text-[#0f294a] border-blue-200',
          'bg-indigo-50 text-[#1e3a5f] border-indigo-200',
          'bg-sky-50 text-[#0f294a] border-sky-200',
          'bg-cyan-50 text-[#0f294a] border-cyan-200'
        ];
        data.platforms.push({
          id: 'plat_' + uuid(),
          name,
          badge: badges[data.platforms.length % badges.length],
          myrPerCoin: rate,
          customRateEdited: true,
          builtin: false
        });
        save();
        closeModal();
        renderHome();
        showToast(`已新增软件「${name}」`, 'success');
      }
    }

    function delPlatform(id) {
      const p = data.platforms.find(x => x.id === id);
      if (!p || p.builtin) return;
      const usedByVenues = data.venues.filter(v => v.platform === id);
      const fallbackId = data.platforms.find(x => x.id !== id)?.id || 'miya';
      usedByVenues.forEach(v => {
        v.platform = fallbackId;
      });
      data.platforms = data.platforms.filter(x => x.id !== id);
      save();
      renderHome();
      showToast(`已删除软件「${p.name}」`, 'info');
    }

    function saveGlobalRate() {
      const val = parseFloat(document.getElementById('usdRateInput').value);
      if (isNaN(val) || val <= 0) {
        showToast('请输入大于 0 的汇率数值', 'error');
        return;
      }
      data.global.usdToMyr = val;
      save();
      renderHome();
      showToast(`Migo 汇率已保存：1 USD = ${val} MYR`, 'success');
    }

          </div>
          <div class="grid grid-cols-2 gap-3">

              <label class="block text-xs font-semibold text-[#1e3a5f] mb-1">营业开始</label>

          </div>
          <div class="grid grid-cols-2 gap-3">

              <label class="block text-xs font-semibold text-[#1e3a5f] mb-1">排档每档金币</label>
              <input type="number" min="0" step="1" id="mSchCoin" class="input-navy" value="${target.scheduleCoinPer}">

            <div>
              <label class="block text-xs font-semibold text-[#1e3a5f] mb-1">主持每小时金币</label>

          </button>
        </div>
      `);

    function onModalPlatformChange() {
      const pid = document.getElementById('mPlatform').value;
      const el = document.getElementById('mRuleDesc');
      const p = getPlatformById(pid);
      if (el && p) el.textContent = getPlatformRuleText(p, data.global);
    }

    function saveVenueModal(editId) {
      const name = document.getElementById('mName').value.trim();
      const platform = document.getElementById('mPlatform').value;
      const openStart = document.getElementById('mOpenStart').value || '20:00';
      const openEnd = document.getElementById('mOpenEnd').value || '02:00';
      const scheduleCoinPer = Math.max(0, Number(document.getElementById('mSchCoin').value) || 0);
      const hostCoinPerHour = Math.max(0, Number(document.getElementById('mHostCoin').value) || 0);

      if (!name) {
        showToast('请填写场地名称', 'error');
        return;
      }

      if (editId) {
        const v = data.venues.find(x => x.id === editId);
        if (!v) return;
        v.name = name;
        v.platform = platform;
        v.openStart = openStart;
        v.openEnd = openEnd;
        v.scheduleCoinPer = scheduleCoinPer;
        v.hostCoinPerHour = hostCoinPerHour;
        save();
        closeModal();
        showToast('场地已更新', 'success');
        if (currentVenueId === editId) renderVenue();
        else renderHome();
      } else {
        data.venues.push({
          id: uuid(),
          name,
          platform,
          openStart,
          openEnd,
          scheduleCoinPer,
          hostCoinPerHour,
          scheduleList: [],
          hostList: []
        });
        save();
        closeModal();
        renderHome();
        showToast(`已新增场地「${name}」`, 'success');
      }
    }

    function confirmDelVenue(id) {
      const v = data.venues.find(x => x.id === id);
      if (!v) return;
      openModal(`
        <h3 class="text-base font-bold text-[#0f294a] mb-2">确认删除场地</h3>
        <p class="text-sm text-[#5a6b82] mb-5">确定删除场地「<strong class="text-[#0f294a]">${escapeHtml(v.name)}</strong>」吗？该场地的排档和主持记录将被一并清空。</p>
        <div class="flex justify-end gap-2">
          <button class="btn-navy px-4 py-2 text-xs sm:text-sm" onclick="closeModal()">取消</button>
          <button class="btn-navy bg-[#b91c1c] border-[#b91c1c] text-white hover:bg-[#991b1b] px-4 py-2 text-xs sm:text-sm" onclick="delVenue('${id}')">确认删除</button>
        </div>
      `);

    function delVenue(id) {
      data.venues = data.venues.filter(x => x.id !== id);
      save();
      closeModal();
      renderHome();
      showToast('场地已删除', 'info');

     */
    function openVenue(id) {
      currentVenueId = id;
      currentTab = 'schedule';
      selectedScheduleDate = getTodayDateStr();
      selectedHostDate = getTodayDateStr();
      showCustomHostForm = false;
      renderVenue();

      renderVenue();

    /**
     * 排档记录页：严格按选定自然日历日期打卡与归属
     */
    function renderScheduleTab(v) {
      const today = getTodayDateStr();
      const isToday = selectedScheduleDate === today;
      const hours = getOperatingHours(v.openStart, v.openEnd);
      const schPrice = Number(v.scheduleCoinPer) || 0;

      const dayChecked = v.scheduleList.filter(x => x.date === selectedScheduleDate && x.checked);
      const dayCoins = dayChecked.length * schPrice;

      const dateMap = {};
      v.scheduleList.forEach(item => {
        if (!item.checked || !item.date) return;
        if (!dateMap[item.date]) dateMap[item.date] = [];
        dateMap[item.date].push(item.hour);
      });
      const historyDates = Object.keys(dateMap).sort((a, b) => b.localeCompare(a));

      let html = `
        <div class="navy-card p-4 sm:p-5 mb-4">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-3 mb-3 border-b border-[#e6edf6]">
            <div>
              <h3 class="text-base font-bold text-[#0f294a]">${isToday ? '今日排档打卡' : '指定日期排档打卡'}</h3>
              <p class="text-xs text-[#5a6b82]">每档 ${schPrice} 金币 · 严格按所选自然日历日期归属</p>
            </div>
            <div class="flex items-center gap-2">
              <input type="date" class="input-navy !w-auto text-xs py-1.5" value="${selectedScheduleDate}" onchange="onSchDateChange(this.value)">
              ${!isToday ? `<button class="btn-navy px-2.5 py-1.5 text-xs whitespace-nowrap" onclick="onSchDateChange('${today}')">今天</button>` : ''}
            </div>
          </div>

          <div class="flex items-center justify-between text-xs bg-[#f4f7fb] border border-[#dce4ef] px-3 py-2 rounded-lg mb-3">
            <span>归属日期：<strong class="text-[#0f294a]">${selectedScheduleDate}</strong></span>
            <span>已打 <strong class="text-[#0f294a]">${dayChecked.length}</strong> 档 · <strong class="text-[#2563eb]">${dayCoins.toFixed(1)}</strong> 金币</span>
          </div>

          <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-2 my-3">
      `;

      hours.forEach(hh => {
        const key = `${selectedScheduleDate}-${hh}`;
        const rec = v.scheduleList.find(x => x.key === key && x.date === selectedScheduleDate);
        const checked = Boolean(rec?.checked);
        const nextHh = (hh + 1) % 24;

        html += `
          <div class="slot-box ${checked ? 'checked' : ''}" onclick="toggleSchSlot('${key}', ${hh})">
            <div class="text-sm font-semibold">${String(hh).padStart(2, '0')}:00</div>
            <div class="slot-sub text-[10px] text-[#5a6b82] mt-0.5">${checked ? '✓ 已打卡' : `${String(hh).padStart(2, '0')}-${String(nextHh).padStart(2, '0')}时`}</div>
          </div>
        `;
      });

      html += `
          </div>

          <div class="flex justify-end gap-2 pt-3 border-t border-[#e6edf6]">
            <button class="btn-navy px-3 py-1.5 text-xs" onclick="batchSchSlots(true)">一键全选当日</button>
            <button class="btn-navy px-3 py-1.5 text-xs" onclick="batchSchSlots(false)">清空当日</button>
          </div>
        </div>

        <!-- 历史排档汇总 -->
        <div class="navy-card p-4 sm:p-5 mb-4">
          <h3 class="text-sm font-bold text-[#0f294a] mb-3">排档历史日期汇总 (${historyDates.length} 天)</h3>
      `;

      if (historyDates.length === 0) {
        html += `<p class="text-xs text-[#5a6b82] text-center py-4">暂无排档打卡记录</p>`;
      } else {
        html += `<div class="divide-y divide-[#e6edf6]">`;
        historyDates.forEach(d => {
          const hrs = dateMap[d].sort((a, b) => a - b);
          const coins = hrs.length * schPrice;
          const label = hrs.map(h => `${String(h).padStart(2, '0')}:00`).join(', ');
          html += `
            <div class="py-2.5 flex items-center justify-between gap-2">
              <div class="min-w-0 flex-1">
                <div class="flex items-center gap-2 flex-wrap">
                  <span class="text-sm font-bold text-[#0f294a]">${d}</span>
                  <span class="text-xs px-2 py-0.5 rounded bg-[#e8f0fe] text-[#0f294a] font-semibold">${hrs.length} 档 · ${coins.toFixed(1)} 币</span>
                </div>
                <div class="text-xs text-[#5a6b82] truncate mt-0.5">${label}</div>
              </div>
              <button class="btn-navy px-2.5 py-1 text-xs shrink-0" onclick="onSchDateChange('${d}')">查看/修改</button>
            </div>
          `;
        });
        html += `</div>`;
      }

      html += `</div>

        <!-- 排档参数设置 -->
        <div class="navy-card p-4 sm:p-5">
          <h3 class="text-sm font-bold text-[#0f294a] mb-3">排档设置</h3>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div>
              <label class="block text-xs text-[#5a6b82] mb-1">营业时间开始</label>
              <input type="time" id="schStartInput" class="input-navy" value="${v.openStart}">
            </div>
            <div>
              <label class="block text-xs text-[#5a6b82] mb-1">营业时间结束</label>
              <input type="time" id="schEndInput" class="input-navy" value="${v.openEnd}">
            </div>
            <div>
              <label class="block text-xs text-[#5a6b82] mb-1">每档金币</label>
              <input type="number" min="0" id="schCoinInput" class="input-navy" value="${v.scheduleCoinPer}">
            </div>
          </div>
          <div class="mt-3 flex justify-end">
            <button class="btn-navy btn-navy-primary px-4 py-1.5 text-xs" onclick="saveSchSetting()">保存设置</button>
          </div>
        </div>
      `;

      return html;
    }

    function onSchDateChange(newDate) {
      if (!newDate) return;
      selectedScheduleDate = newDate;
      renderVenue();
    }

    function toggleSchSlot(key, hh) {
      const v = data.venues.find(x => x.id === currentVenueId);
      if (!v) return;
      const d = selectedScheduleDate;
      let rec = v.scheduleList.find(x => x.key === key && x.date === d);
      if (!rec) {
        v.scheduleList.push({ key, date: d, hour: hh, checked: true });
      } else {
        rec.checked = !rec.checked;
      }
      save();
      renderVenue();
    }

    function batchSchSlots(checkedVal) {
      const v = data.venues.find(x => x.id === currentVenueId);
      if (!v) return;
      const d = selectedScheduleDate;
      const hours = getOperatingHours(v.openStart, v.openEnd);
      hours.forEach(hh => {
        const key = `${d}-${hh}`;
        const rec = v.scheduleList.find(x => x.key === key && x.date === d);
        if (!rec) {
          if (checkedVal) v.scheduleList.push({ key, date: d, hour: hh, checked: true });
        } else {
          rec.checked = checkedVal;
        }
      });
      save();
      renderVenue();
      showToast(checkedVal ? '已全选当日排档' : '已清空当日排档', 'info');
    }

    function saveSchSetting() {
      const v = data.venues.find(x => x.id === currentVenueId);
      if (!v) return;
      v.openStart = document.getElementById('schStartInput').value || '20:00';
      v.openEnd = document.getElementById('schEndInput').value || '02:00';
      v.scheduleCoinPer = Math.max(0, Number(document.getElementById('schCoinInput').value) || 0);
      save();
      renderVenue();
      showToast('排档设置已保存', 'success');
    }

    /**
     * 主持记录页：按小时格点选打卡 + 可折叠自定义时长
     */
    function renderHostTab(v) {
      const today = getTodayDateStr();
      const isToday = selectedHostDate === today;
      const hostPrice = Number(v.hostCoinPerHour) || 0;

      const displayHours = hostHoursOnlyOperating
        ? getOperatingHours(v.openStart, v.openEnd)
        : Array.from({ length: 24 }, (_, i) => i);

      const daySlotRecords = v.hostList.filter(x => x.date === selectedHostDate && x.type === 'slot');
      const daySlotHours = daySlotRecords.length;
      const daySlotCoins = daySlotHours * hostPrice;

      const dayAllHost = v.hostList.filter(x => x.date === selectedHostDate);
      const dayAllHours = dayAllHost.reduce((sum, item) => sum + getHostRecordHours(item), 0);
      const dayAllCoins = dayAllHours * hostPrice;

      let html = `
        <div class="navy-card p-4 sm:p-5 mb-4">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-3 mb-3 border-b border-[#e6edf6]">
            <div>
              <h3 class="text-base font-bold text-[#0f294a]">${isToday ? '今日主持小时打卡' : '指定日期主持小时打卡'}</h3>
              <p class="text-xs text-[#5a6b82]">点选小时格子即计 1 小时（${hostPrice} 金币/h）· 严格按自然日历日期归属</p>
            </div>
            <div class="flex items-center gap-2 flex-wrap">
              <input type="date" class="input-navy !w-auto text-xs py-1.5" value="${selectedHostDate}" onchange="onHostDateChange(this.value)">
              ${!isToday ? `<button class="btn-navy px-2.5 py-1.5 text-xs whitespace-nowrap" onclick="onHostDateChange('${today}')">今天</button>` : ''}
            </div>
          </div>

          <div class="flex flex-wrap items-center justify-between gap-2 text-xs bg-[#f4f7fb] border border-[#dce4ef] px-3 py-2 rounded-lg mb-3">
            <div class="flex items-center gap-2 flex-wrap">
              <span>日期：<strong class="text-[#0f294a]">${selectedHostDate}</strong></span>
              <span class="text-[#cbd6e6]">|</span>
              <span>本日本日格子：<strong class="text-[#0f294a]">${daySlotHours}h</strong> (${daySlotCoins.toFixed(1)}币)</span>
              ${dayAllHours !== daySlotHours ? `<span class="text-[#2563eb]">· 当日含自定义共 ${dayAllHours.toFixed(1)}h (${dayAllCoins.toFixed(1)}币)</span>` : ''}
            </div>
            <button class="btn-navy px-2.5 py-1 text-[11px]" onclick="toggleHostHourScope()">
              ${hostHoursOnlyOperating ? '切换为全天 24 小时格' : '仅看营业时段格子'}
            </button>
          </div>

          <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-2 my-3">
      `;

      displayHours.forEach(hh => {
        const slotRec = v.hostList.find(x => x.date === selectedHostDate && x.type === 'slot' && x.hour === hh);
        const checked = Boolean(slotRec);
        const nextHh = (hh + 1) % 24;

        html += `
          <div class="slot-box ${checked ? 'checked' : ''}" onclick="toggleHostHourSlot(${hh})">
            <div class="text-sm font-semibold">${String(hh).padStart(2, '0')}:00</div>
            <div class="slot-sub text-[10px] text-[#5a6b82] mt-0.5">${checked ? '✓ 1小时' : `${String(hh).padStart(2, '0')}-${String(nextHh).padStart(2, '0')}时`}</div>
          </div>
        `;
      });

      html += `
          </div>

          <div class="flex flex-wrap items-center justify-between gap-2 pt-3 border-t border-[#e6edf6]">
            <button class="btn-navy px-3 py-1.5 text-xs" onclick="toggleCustomHostForm()">
              ${showCustomHostForm ? '收起自定义时长表单' : '⊕ 备用：自定义起止时间 / 非整小时'}
            </button>
            <div class="flex gap-2">
              <button class="btn-navy px-3 py-1.5 text-xs" onclick="batchHostSlots(true)">全选当前格子</button>
              <button class="btn-navy px-3 py-1.5 text-xs" onclick="batchHostSlots(false)">清空当日格子</button>
            </div>
          </div>

          ${showCustomHostForm ? `
            <div class="mt-4 pt-4 border-t border-dashed border-[#c7d4e6] bg-[#f9fbfe] p-3.5 rounded-xl">
              <div class="text-xs font-bold text-[#1e3a5f] mb-2.5">自定义主持时段（归属日期：${selectedHostDate}）</div>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5 mb-2.5">
                <div>
                  <label class="block text-[11px] text-[#5a6b82] mb-1">开始时间</label>
                  <input type="time" id="customHostStart" class="input-navy text-xs py-1.5" value="21:00">
                </div>
                <div>
                  <label class="block text-[11px] text-[#5a6b82] mb-1">结束时间</label>
                  <input type="time" id="customHostEnd" class="input-navy text-xs py-1.5" value="21:30">
                </div>
                <div>
                  <label class="block text-[11px] text-[#5a6b82] mb-1">备注</label>
                  <input type="text" id="customHostNote" class="input-navy text-xs py-1.5" placeholder="例如：半小时补场">
                </div>
              </div>
              <div class="flex justify-end">
                <button class="btn-navy btn-navy-primary px-3.5 py-1.5 text-xs" onclick="addCustomHostRecord()">添加自定义时长</button>
              </div>
            </div>
          ` : ''}
        </div>

        <div class="navy-card p-4 sm:p-5 mb-4">
          <h3 class="text-sm font-bold text-[#0f294a] mb-3">主持记录明细 (${v.hostList.length} 条)</h3>
      `;

      if (v.hostList.length === 0) {
        html += `<p class="text-xs text-[#5a6b82] text-center py-5">暂无主持记录，点击上方小时格即可打卡</p>`;
      } else {
        html += `<div class="divide-y divide-[#e6edf6]">`;
        v.hostList.slice().reverse().forEach(h => {
          const hrs = getHostRecordHours(h);
          const coins = hrs * hostPrice;
          let timeTag = '';
          if (h.type === 'slot' && typeof h.hour === 'number') {
            const nextH = (h.hour + 1) % 24;
            timeTag = `${String(h.hour).padStart(2, '0')}:00~${String(nextH).padStart(2, '0')}:00 (小时格)`;
          } else {
            const sStr = h.startTime ? h.startTime.slice(11, 16) : '';
            const eStr = h.endTime ? h.endTime.slice(11, 16) : '';
            timeTag = sStr && eStr ? `${sStr}~${eStr}` : '自定义时长';
          }

          html += `
            <div class="py-2.5 flex items-center justify-between gap-2">
              <div class="min-w-0 flex-1">
                <div class="flex items-center gap-2 flex-wrap">
                  <span class="text-sm font-bold text-[#0f294a]">${h.date}</span>
                  <span class="text-xs px-2 py-0.5 rounded bg-[#f4f7fb] border border-[#dce4ef] text-[#1e3a5f]">${timeTag}</span>
                  <span class="text-xs font-semibold text-[#2563eb]">${hrs.toFixed(2)}h · ${coins.toFixed(1)} 金币</span>
                </div>
                ${h.note ? `<div class="text-xs text-[#5a6b82] mt-0.5">${escapeHtml(h.note)}</div>` : ''}
              </div>
              <button class="btn-navy btn-navy-danger px-2.5 py-1 text-xs shrink-0" onclick="delHostRecord('${h.id}')">删除</button>
            </div>
          `;
        });
        html += `</div>`;
      }

      html += `</div>

        <div class="navy-card p-4 sm:p-5">
          <h3 class="text-sm font-bold text-[#0f294a] mb-3">主持设置</h3>
          <div class="flex items-end gap-3">
            <div class="flex-1 max-w-xs">
              <label class="block text-xs text-[#5a6b82] mb-1">主持每小时金币</label>
              <input type="number" min="0" id="hostCoinInput" class="input-navy" value="${v.hostCoinPerHour}">
            </div>
            <button class="btn-navy btn-navy-primary px-4 py-1.5 text-xs" onclick="saveHostSetting()">保存</button>
          </div>
        </div>
      `;

      return html;
    }

    function onHostDateChange(newDate) {
      if (!newDate) return;
      selectedHostDate = newDate;
      renderVenue();
    }

    function toggleHostHourScope() {
      hostHoursOnlyOperating = !hostHoursOnlyOperating;
      renderVenue();
    }

    function toggleCustomHostForm() {
      showCustomHostForm = !showCustomHostForm;
      renderVenue();
    }

    function toggleHostHourSlot(hh) {
      const v = data.venues.find(x => x.id === currentVenueId);
      if (!v) return;
      const d = selectedHostDate;
      const idx = v.hostList.findIndex(x => x.date === d && x.type === 'slot' && x.hour === hh);
      if (idx >= 0) {
        v.hostList.splice(idx, 1);
      } else {
        const nextHh = (hh + 1) % 24;
        v.hostList.push({
          id: uuid(),
          date: d,
          type: 'slot',
          hour: hh,
          hours: 1,
          startTime: `${d}T${String(hh).padStart(2, '0')}:00`,
          endTime: `${d}T${String(nextHh).padStart(2, '0')}:00`,
          note: ''
        });
      }
      save();
      renderVenue();
    }

    function batchHostSlots(enable) {
      const v = data.venues.find(x => x.id === currentVenueId);
      if (!v) return;
      const d = selectedHostDate;
      const scopeHours = hostHoursOnlyOperating
        ? getOperatingHours(v.openStart, v.openEnd)
        : Array.from({ length: 24 }, (_, i) => i);

      if (enable) {
        scopeHours.forEach(hh => {
          const exists = v.hostList.some(x => x.date === d && x.type === 'slot' && x.hour === hh);
          if (!exists) {
            const nextHh = (hh + 1) % 24;
            v.hostList.push({
              id: uuid(),
              date: d,
              type: 'slot',
              hour: hh,
              hours: 1,
              startTime: `${d}T${String(hh).padStart(2, '0')}:00`,
              endTime: `${d}T${String(nextHh).padStart(2, '0')}:00`,
              note: ''
            });
          }
        });
        showToast('已勾选当前主持时段格子', 'info');
      } else {
        v.hostList = v.hostList.filter(x => !(x.date === d && x.type === 'slot' && scopeHours.includes(x.hour)));
        showToast('已清空当前主持小时格', 'info');
      }
      save();
      renderVenue();
    }

    function addCustomHostRecord() {
      const v = data.venues.find(x => x.id === currentVenueId);
      if (!v) return;
      const stTime = document.getElementById('customHostStart').value;
      const etTime = document.getElementById('customHostEnd').value;
      const note = document.getElementById('customHostNote').value.trim();

      if (!stTime || !etTime) {
        showToast('请填写开始和结束时间', 'error');
        return;
      }

      const [sh, sm] = stTime.split(':').map(Number);
      const [eh, em] = etTime.split(':').map(Number);
      const diffHours = ((eh * 60 + em) - (sh * 60 + sm)) / 60;

      if (diffHours <= 0) {
        showToast('结束时间需晚于开始时间（同日内）', 'error');
        return;
      }

      const d = selectedHostDate;
      v.hostList.push({
        id: uuid(),
        date: d,
        type: 'custom',
        hours: diffHours,
        startTime: `${d}T${stTime}`,
        endTime: `${d}T${etTime}`,
        note
      });
      save();
      renderVenue();
      showToast(`已添加自定义主持 ${diffHours.toFixed(2)} 小时`, 'success');
    }

    function delHostRecord(id) {
      const v = data.venues.find(x => x.id === currentVenueId);
      if (!v) return;
      v.hostList = v.hostList.filter(x => x.id !== id);
      save();
      renderVenue();
      showToast('已删除主持记录', 'info');
    }

    function saveHostSetting() {
      const v = data.venues.find(x => x.id === currentVenueId);
      if (!v) return;
      v.hostCoinPerHour = Math.max(0, Number(document.getElementById('hostCoinInput').value) || 0);
      save();
      renderVenue();
      showToast('主持时薪已保存', 'success');
    }

    /**
     * =========================================================
     * 6. 备份导出与导入校验
     * =========================================================
     */
    function exportBackup() {
      try {
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `排档主持记录备份_${getTodayDateStr()}.json`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        showToast('备份文件已导出', 'success');
      } catch (e) {
        showToast('导出失败', 'error');
      }
    }

    function importBackup() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json,application/json';
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const parsed = JSON.parse(ev.target.result);
            if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.venues)) {
              throw new Error('缺少 venues 数组');
            }
            if (!parsed.global || typeof parsed.global.usdToMyr !== 'number' || isNaN(parsed.global.usdToMyr)) {
              parsed.global = { usdToMyr: 4.6 };
            }
            if (!Array.isArray(parsed.platforms) || parsed.platforms.length === 0) {
              parsed.platforms = getDefaultPlatforms();
            }
            const validIds = new Set(parsed.platforms.map(p => p.id));
            parsed.venues.forEach(v => {
              if (!v.id) v.id = uuid();
              if (!v.name) v.name = '未命名场地';
              if (!validIds.has(v.platform)) v.platform = parsed.platforms[0]?.id || 'miya';
              if (!Array.isArray(v.scheduleList)) v.scheduleList = [];
              if (!Array.isArray(v.hostList)) v.hostList = [];
            });

            data = parsed;
            save();
            renderHome();
            showToast(`已导入 ${data.venues.length} 个场地数据`, 'success');
          } catch (err) {
            console.error('导入校验失败:', err);
            showToast('导入失败：JSON 数据结构不合法', 'error');
          }
        };
        reader.readAsText(file);
      };
      input.click();
    }

    // 初始渲染首页
    renderHome();
  </script>
</body>
</html>
